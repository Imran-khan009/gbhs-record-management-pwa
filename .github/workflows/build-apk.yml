name: Build Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Package Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Bun Environment
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Install Project Dependencies
        run: bun install --frozen-lockfile

      - name: Build Web Application
        run: bun run build

      - name: Sync Capacitor Android
        run: bun x cap sync android

      - name: Make Gradlew Executable
        run: chmod +x ./android/gradlew

      - name: Build Android Debug APK
        working-directory: ./android
        run: ./gradlew assembleDebug --stacktrace
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk

      - name: Rename APK for clarity
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk gbhs-record-management.apk

      - name: Upload APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: gbhs-record-management-apk
          path: gbhs-record-management.apk
          retention-days: 30

      - name: Create or Update GitHub Release with APK
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: latest-apk
          name: "GBHS Record Management - Latest Android APK"
          body: |
            ## GBHS Record Management Android App (APK)
            
            - **Package**: `pk.edu.gbhs.recordmanagement`
            - **App Name**: GBHS Record Management
            - **Build Type**: Debug APK (Installable directly on any Android device)
            
            ### How to Install:
            1. Download `gbhs-record-management.apk` below.
            2. Open the downloaded APK on your Android phone/tablet.
            3. Allow installation from unknown sources if prompted.
            4. Launch and use the app offline or online!
          files: gbhs-record-management.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
